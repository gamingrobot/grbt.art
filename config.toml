base_url = "https://grbt.art"

title = "Art Stuff"
description = "Morgan's Art Stuff"
author = "Morgan Creekmore"

theme = "zallery"

compile_sass = true
generate_feeds = true

taxonomies = [
    {name = "tags", rss = false},
]

[extra]
menu = [
    {url = "https://graphics.social/@gamingrobot", name = "Mastodon"},
    {url = "https://www.artstation.com/gamingrobot", name = "Artstation"},
    {url = "atom.xml", name = "RSS"},
]

theme_color = "#0d314b" # color for browser

author_url = "https://creekmore.dev"
cover_image = "cover.png" # cover image on main gallery pages for opengraph and twitter embeds 

hide_copyright = false # set to true to hide the copyright at the bottom of the page
hide_poweredby = false # set to true to hide the poweredby at the bottom of the page

# gallery settings
thumbnail_size = 400 # May need to adjust the media queries in _gallery.scss
thumbnail_format = "webp" # auto, jpg, png, webp
thumbnail_quality = 90 # value in percentage, only for webp and jpg

# img shortcode settings
covert_images = false # set to true to convert images to to the format in the image_format setting 
create_mobile_images = true # set to true to create mobile friendly versions of the image
image_format = "webp" # auto, jpg, png, webp
image_quality = 100 # value in percentage, only for webp and jpg

# https://modelviewer.dev/
modelviewer = false # set to false to disable loading modelviewer javascript

# https://github.com/francoischalifour/medium-zoom
jszoom = true # set to false to disable javascript based image zoom (will fallback to link to the full image with a button)

# https://www.goatcounter.com/
goatcounter = "grbt-art"
